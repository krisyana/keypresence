# Optional: a real PostgreSQL for local development. Without it the app uses embedded PGlite.
#   docker compose up -d   then set DATABASE_URL=postgres://keypresence:keypresence@localhost:5432/keypresence
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: keypresence, POSTGRES_PASSWORD: keypresence, POSTGRES_DB: keypresence }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U keypresence"], interval: 5s, retries: 10 }
volumes: { pgdata: {} }
